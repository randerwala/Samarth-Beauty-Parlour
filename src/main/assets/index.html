<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#713b64"><title>બ્યુટી પાર્લર મેનેજર</title>
<style>
:root{--plum:#713b64;--pink:#f7eaf2;--gold:#e6c47a;--ink:#30232d;--muted:#796c76;--line:#eadde6}
*{box-sizing:border-box}body{margin:0;background:#fbf7fa;color:var(--ink);font-family:Arial,"Noto Sans Gujarati",sans-serif}
header{background:linear-gradient(135deg,#713b64,#9a5a88);color:white;padding:22px 18px 18px;border-radius:0 0 24px 24px}
.brand{font-size:22px;font-weight:800}.sub{opacity:.85;font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat{background:#ffffff20;border:1px solid #ffffff30;border-radius:14px;padding:12px}.stat small{display:block;opacity:.85}.stat strong{display:block;font-size:24px;margin-top:5px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 14px 0}.nav{border:1px solid var(--line);background:white;border-radius:12px;padding:11px 4px;color:var(--plum);font-size:13px;font-weight:700}.nav.active{background:var(--pink);border-color:#b77ca7}
main{padding:14px;max-width:680px;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 3px 14px #5a244408}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:13px}.heading{font-size:19px;font-weight:800;margin:5px 0 14px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}button{cursor:pointer}.primary{background:var(--plum);color:white;border:0;border-radius:11px;padding:13px 15px;font-weight:700;font-size:15px;width:100%}.secondary{background:var(--pink);color:var(--plum);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700}.danger{background:#fff0f0;color:#a12626;border:1px solid #f0cccc;border-radius:9px;padding:8px 10px}.pill{background:var(--pink);color:var(--plum);padding:5px 8px;border-radius:20px;font-size:12px;font-weight:700}.empty{text-align:center;padding:22px;color:var(--muted)}.price{font-size:18px;font-weight:800;color:var(--plum)}.offer{background:linear-gradient(135deg,#f8e7f2,#fff6dd);border-radius:14px;padding:17px;text-align:center;color:var(--plum)}.smallbtn{font-size:12px;padding:8px}.foot{text-align:center;padding:18px;color:var(--muted);font-size:11px}
</style></head>
<body>
<header><div class="brand" id="brandTitle">Festival Dhamaka Beauty Parlour</div><div class="sub">તમારી સુંદરતા, અમારી ઓળખ ✨</div>
<div class="stats"><div class="stat"><small>કુલ બુકિંગ</small><strong id="totalBookings">0</strong></div><div class="stat"><small>આવક</small><strong id="income">₹0</strong></div></div></header>
<nav id="nav">
<button class="nav active" data-tab="home">🏠 હોમ</button><button class="nav" data-tab="booking">📅 બુકિંગ</button><button class="nav" data-tab="customers">👩 ગ્રાહકો</button><button class="nav" data-tab="services">✂️ સર્વિસ</button><button class="nav" data-tab="billing">🧾 બિલ / આવક</button><button class="nav" data-tab="offers">🎁 ઓફર</button>
</nav><main id="app"></main><div class="foot">ગુજરાતી બ્યુટી પાર્લર મેનેજર · ડેટા આ ફોનમાં સાચવાય છે</div>
<script>
const KEY='fd_beauty_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{salon:'Festival Dhamaka Beauty Parlour',services:[{name:'ફેશિયલ',price:500},{name:'હેર કટિંગ',price:200},{name:'મેકઅપ',price:1500},{name:'મહેંદી',price:300}],bookings:[],offer:'તહેવારની ખાસ ઓફર',discount:20};
let tab='home';
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function options(){return data.services.map((s,i)=>`<option value="${i}">${esc(s.name)} — ${money(s.price)}</option>`).join('')}
function card(b,i){return `<div class="card"><div class="row"><div><b>${esc(b.name)}</b><div class="muted">${esc(b.phone)} · ${esc(b.date)} ${b.time?'· '+esc(b.time):''}</div><div style="margin-top:7px">${esc(b.service)}</div></div><div style="text-align:right"><div class="price">${money(b.price)}</div><span class="pill">${b.paid?'ચૂકવેલ':'બાકી'}</span></div></div><div class="row" style="margin-top:12px"><button class="secondary smallbtn" onclick="togglePaid(${i})">${b.paid?'ચુકવણી રદ':'ચુકવણી નોંધો'}</button><button class="danger smallbtn" onclick="removeBooking(${i})">કાઢી નાખો</button></div></div>`}
function render(){
document.getElementById('brandTitle').textContent=data.salon;
document.getElementById('totalBookings').textContent=data.bookings.length;
document.getElementById('income').textContent=money(data.bookings.filter(b=>b.paid).reduce((a,b)=>a+Number(b.price),0));
document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));
let app=document.getElementById('app');
if(tab==='home'){let today=new Date().toISOString().slice(0,10);let todays=data.bookings.filter(b=>b.date===today);app.innerHTML=`<div class="heading">નમસ્તે! 👋</div><div class="card"><div class="row"><div><b>આજનાં બુકિંગ</b><div class="muted">આજના ગ્રાહકોની યાદી</div></div><span class="pill">${todays.length} બુકિંગ</span></div></div>${todays.length?todays.map(b=>card(b,data.bookings.indexOf(b))).join(''):'<div class="card empty">આજે કોઈ બુકિંગ નથી.<br><br>નવું બુકિંગ ઉમેરવા “બુકિંગ” પસંદ કરો.</div>'}<div class="card"><b>ઝડપી કામ</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="secondary" onclick="go('booking')">＋ નવું બુકિંગ</button><button class="secondary" onclick="go('billing')">₹ આવક જુઓ</button></div></div>`}
if(tab==='booking'){app.innerHTML=`<div class="heading">નવું બુકિંગ / ગ્રાહક બુકિંગ</div><div class="card"><form id="bookForm"><div class="field"><label>ગ્રાહકનું નામ *</label><input name="name" required placeholder="ગ્રાહકનું પૂરું નામ"></div><div class="field"><label>મોબાઇલ નંબર *</label><input name="phone" required type="tel" pattern="[0-9+() -]{8,16}" placeholder="મોબાઇલ નંબર"></div><div class="field"><label>સર્વિસ પસંદ કરો</label><select name="service" id="serviceSelect">${options()}</select></div><div class="field"><label>તારીખ *</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>સમય</label><input type="time" name="time" value="10:00"></div><div class="field"><label>કિંમત (₹)</label><input type="number" min="0" name="price" id="bookingPrice" value="${data.services[0]?.price||0}" required></div><div class="field"><label>નોંધ (વૈકલ્પિક)</label><textarea name="note" rows="2" placeholder="વધારાની માહિતી"></textarea></div><button class="primary">બુકિંગ સેવ કરો</button></form></div><div class="muted">ગ્રાહકની મંજૂરીથી તેની બુકિંગ વિગતો નોંધો. આ આવૃત્તિમાં બુકિંગ આ ફોનમાં જ સેવ થાય છે.</div>`;
let sel=document.getElementById('serviceSelect');sel.onchange=()=>{document.getElementById('bookingPrice').value=data.services[sel.value]?.price||0};document.getElementById('bookForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let s=data.services[Number(f.get('service'))];data.bookings.unshift({name:f.get('name'),phone:f.get('phone'),service:s?.name||'સર્વિસ',date:f.get('date'),time:f.get('time'),price:Number(f.get('price')),note:f.get('note'),paid:false,created:Date.now()});save();tab='customers';render();alert('બુકિંગ સફળતાપૂર્વક સેવ થયું!')}}
if(tab==='customers'){app.innerHTML=`<div class="heading">ગ્રાહકો અને બુકિંગ</div><div class="field"><input id="search" placeholder="નામ અથવા મોબાઇલથી શોધો"></div><div id="bookingList">${data.bookings.length?data.bookings.map(card).join(''):'<div class="card empty">હજુ બુકિંગ નથી.</div>'}</div>`;document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase();document.getElementById('bookingList').innerHTML=data.bookings.map((b,i)=>({...b,_i:i})).filter(b=>(b.name+' '+b.phone).toLowerCase().includes(q)).map(b=>card(b,b._i)).join('')||'<div class="card empty">કોઈ ગ્રાહક મળ્યો નથી.</div>'}}
if(tab==='services'){app.innerHTML=`<div class="heading">સર્વિસ અને ભાવ</div>${data.services.map((s,i)=>`<div class="card row"><div><b>${esc(s.name)}</b><div class="price">${money(s.price)}</div></div><button class="danger" onclick="deleteService(${i})">કાઢો</button></div>`).join('')}<div class="card"><b>નવી સર્વિસ ઉમેરો</b><form id="serviceForm"><div class="field"><label>સર્વિસનું નામ</label><input name="name" required></div><div class="field"><label>ભાવ (₹)</label><input name="price" type="number" min="0" required></div><button class="primary">સર્વિસ ઉમેરો</button></form></div>`;document.getElementById('serviceForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.services.push({name:f.get('name'),price:Number(f.get('price'))});save()}}
if(tab==='billing'){let total=data.bookings.filter(b=>b.paid).reduce((a,b)=>a+Number(b.price),0),pending=data.bookings.filter(b=>!b.paid).reduce((a,b)=>a+Number(b.price),0);app.innerHTML=`<div class="heading">બિલ અને આવકનો હિસાબ</div><div class="stats" style="margin:0 0 14px"><div class="card"><div class="muted">મળેલી આવક</div><div class="price">${money(total)}</div></div><div class="card"><div class="muted">બાકી રકમ</div><div class="price">${money(pending)}</div></div></div><div class="row" style="margin-bottom:12px"><b>બુકિંગ પ્રમાણે બિલ</b><button class="secondary" onclick="exportCSV()">CSV ડાઉનલોડ</button></div>${data.bookings.length?data.bookings.map(card).join(''):'<div class="card empty">હજુ બિલ માટે બુકિંગ નથી.</div>'}`}
if(tab==='offers'){app.innerHTML=`<div class="heading">ઓફર અને ડિસ્કાઉન્ટ</div><div class="offer"><div style="font-size:26px">🎀 ✨ 🎀</div><h2>${esc(data.offer)}</h2><div style="font-size:36px;font-weight:900">${Number(data.discount)||0}% OFF</div><div>તમારી સુંદરતા માટે ખાસ ઓફર!</div></div><div class="card" style="margin-top:12px"><form id="offerForm"><div class="field"><label>ઓફરનું નામ</label><input name="offer" value="${esc(data.offer)}" required></div><div class="field"><label>ડિસ્કાઉન્ટ (%)</label><input name="discount" type="number" min="0" max="100" value="${Number(data.discount)||0}" required></div><button class="primary">ઓફર સેવ કરો</button></form><button class="secondary" style="width:100%;margin-top:10px" onclick="shareOffer()">WhatsApp / શેર માટે મેસેજ</button></div>`;document.getElementById('offerForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.offer=f.get('offer');data.discount=Number(f.get('discount'));save()}}
}
function go(t){tab=t;render()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.tab));
function togglePaid(i){data.bookings[i].paid=!data.bookings[i].paid;save()}
function removeBooking(i){if(confirm('આ બુકિંગ કાયમ માટે કાઢી નાખવું છે?')){data.bookings.splice(i,1);save()}}
function deleteService(i){if(confirm('આ સર્વિસ કાઢી નાખવી છે?')){data.services.splice(i,1);save()}}
function exportCSV(){let rows=[['નામ','મોબાઇલ','સર્વિસ','તારીખ','સમય','કિંમત','ચુકવણી'],...data.bookings.map(b=>[b.name,b.phone,b.service,b.date,b.time,b.price,b.paid?'ચૂકવેલ':'બાકી'])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='beauty-parlour-records.csv';a.click();URL.revokeObjectURL(a.href)}
function shareOffer(){let msg=`${data.salon}\n${data.offer}\n${data.discount}% ડિસ્કાઉન્ટ\nઆજે જ બુકિંગ કરાવો!`;if(navigator.share)navigator.share({text:msg}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(msg).then(()=>alert('ઓફર મેસેજ કોપી થયો'));else alert(msg)}
render();
</script></body></html>
